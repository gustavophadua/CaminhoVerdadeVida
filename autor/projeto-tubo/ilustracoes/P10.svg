<polyline points="946.6,667.1 954,664 946.6,660.9" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="6 4" stroke-linejoin="round"/><text x="40" y="820" font-size="16" text-anchor="start" fill="#333">Seta cheia: f1. Tracejada: f2. A soma passa intacta; a diferença sai multiplicada por e = √(1 − perda).</text>
