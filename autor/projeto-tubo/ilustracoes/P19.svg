<text x="40" y="56" font-size="30" text-anchor="start" fill="#111" font-weight="bold">Alpha e Omega sobre a onda</text>
<text x="40" y="88" font-size="18" text-anchor="start" fill="#333">Para alpha, um anel em volta da onda inteira. Para omega, um anel em cada fatia, e o fragmento num deles.</text>
