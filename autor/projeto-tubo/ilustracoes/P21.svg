<text x="40" y="56" font-size="30" text-anchor="start" fill="#111" font-weight="bold">A física de referência</text>
<text x="40" y="88" font-size="18" text-anchor="start" fill="#333">Os quatro desenhos da seção 6.3, no mesmo formato: espaço na horizontal, tempo na vertical.</text>
