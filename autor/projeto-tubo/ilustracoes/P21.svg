 luz</text><path d="M 890 315 L 770 195 L 1010 195 Z" fill="url(#pont)" stroke="none"/><path d="M 890 315 L 770 435 L 1010 435 Z" fill="url(#hach)" fill-opacity="0.3" stroke="none"/><line x1="765" y1="190" x2="1015" y2="440" stroke="#111" stroke-width="2"/><line x1="1015" y1="190" x2="765" y2="440" stroke="#111" stroke-width="2"/><circle cx="890" cy="315" r="6" fill="#111" stroke="#111" stroke-width="0"/><line x1="650" y1="315" x2="1130" y2="315" stroke="#8a8a8a" stroke-width="1.5"/><line x1="650" y1="375" x2="1130" y2="255" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5"/><text x="890" y="185" font-size="14" text-anchor="middle" fill="#111">futuro</text><text x="890" y="461" font-size="14" text-anchor="middle" fill="#111">passado</text><text x="1140" y="341" font-size="12" text-anchor="end" fill="#555">"agora" de quem está parado</text><text x="1140" y="245" font-size="12" text-anchor="end" fill="#555">"agora" de quem se move</text><rect x="40" y="490" width="540" height="330" fill="none" stroke="#d6d6d6" stroke-width="1"/><text x="56" y="518" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Einstein (1915): gravidade é geometria</text><line x1="340" y1="800" x2="340" y2="540" stroke="#111" stroke-width="6"/><text x="350" y="550" font-size="14" text-anchor="start" fill="#111">massa</text><line x1="140" y1="720" x2="125.2" y2="694" stroke="#111" stroke-width="1.5"/><line x1="140" y1="720" x2="169.2" y2="694" stroke="#111" stroke-width="1.5"/><line x1="220" y1="640" x2="210" y2="614" stroke="#111" stroke-width="1.5"/><line x1="220" y1="640" x2="254" y2="614" stroke="#111" stroke-width="1.5"/><line x1="460" y1="720" x2="426" y2="694" stroke="#111" stroke-width="1.5"/><line x1="460" y1="720" x2="470" y2="694" stroke="#111" stroke-width="1.5"/><line x1="540" y1="640" x2="510.8" y2="614" stroke="#111" stroke-width="1.5"/><line x1="540" y1="640" x2="554.8" y2="614" stroke="#111" stroke-width="1.5"/><polyline points="110,790 110.1,785.2 110.3,780.4