<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
<defs><pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="1.2"/></pattern>
<pattern id="pont" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1" fill="#111"/></pattern></defs>
<rect width="1200" height="900" fill="#fff"/>
<text x="40" y="56" font-size="30" text-anchor="start" fill="#111" font-weight="bold">Valor e mecanismo</text>
<text x="40" y="88" font-size="18" text-anchor="start" fill="#333">Os valores dados no início descem pelos mecanismos e são filtrados.</text>
<line x1="80" y1="520" x2="370" y2="520" stroke="#111" stroke-width="1.2"/><rect x="90" y="220" width="34" height="300" fill="#111"/><text x="107" y="560" font-size="14" text-anchor="middle" fill="#333">f1</text><rect x="136" y="520" width="34" height="15" fill="#111"/><text x="153" y="560" font-size="14" text-anchor="middle" fill="#333">f2</text><rect x="182" y="505" width="34" height="15" fill="#111"/><text x="199" y="560" font-size="14" text-anchor="middle" fill="#333">f3</text><rect x="228" y="520" width="34" height="15" fill="#111"/><text x="245" y="560" font-size="14" text-anchor="middle" fill="#333">f4</text><rect x="274" y="505" width="34" height="15" fill="#111"/><text x="291" y="560" font-size="14" text-anchor="middle" fill="#333">f5</text><rect x="320" y="520" width="34" height="15" fill="#111"/><text x="337" y="560" font-size="14" text-anchor="middle" fill="#333">f6</text><text x="228" y="620" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">valor próprio (o início)</text><rect x="470" y="330" width="260" height="240" fill="url(#pont)" stroke="#111" stroke-width="2"/><text x="600" y="300" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">mecanismo</text><text x="600" y="600" font-size="16" text-anchor="middle" fill="#333">colisões, perda 50 %</text><line x1="390" y1="450" x2="460" y2="450" stroke="#111" stroke-width="3"/><polyline points="448.9,454.7 460,450 448.9,445.3" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="740" y1="450" x2="810" y2="450" stroke="#111" stroke-width="3"/><polyline points="798.9,454.7 810,450 798.9,445.3" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="820" y1="520" x2="1110" y2="520" stroke="#111" stroke-width="1.2"/><rect x="830" y="470.1" width="34" height="49.9" fill="#111"/><text x="847" y="560" font-size="14" text-anchor="middle" fill="#333">f1</text><rect x="876" y="472.6" width="34" height="47.4" fill="#111"/><text x="893" y="560" font-size="14" text-anchor="middle" fill="#333">f2</text><rect x="922" y="471.8" width="34" height="48.2" fill="#111"/><text x="939" y="560" font-size="14" text-anchor="middle" fill="#333">f3</text><rect x="968" y="473.3" width="34" height="46.7" fill="#111"/><text x="985" y="560" font-size="14" text-anchor="middle" fill="#333">f4</text><rect x="1014" y="472.5" width="34" height="47.5" fill="#111"/><text x="1031" y="560" font-size="14" text-anchor="middle" fill="#333">f5</text><rect x="1060" y="474.7" width="34" height="45.3" fill="#111"/><text x="1077" y="560" font-size="14" text-anchor="middle" fill="#333">f6</text><text x="968" y="620" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">valor destinado (filtrado)</text><text x="90" y="700" font-size="17" text-anchor="start" fill="#111">soma no início 1,90; soma no fim 1,90: a soma passa intacta.</text><text x="90" y="728" font-size="17" text-anchor="start" fill="#111">maior diferença no início 2,10; no fim 0,031: a diferença foi filtrada.</text><text x="90" y="756" font-size="17" text-anchor="start" fill="#111">Alpha conhece o início e o mecanismo, então sabe o fim. O fragmento só tem o próprio valor.</text>
<line x1="40" y1="844" x2="1160" y2="844" stroke="#d6d6d6" stroke-width="1"/>
<text x="40" y="866" font-size="14" text-anchor="start" fill="#555">Do autor: A.10. Proposta minha para D11 (valor próprio e destinado), pendente. Medido na máquina: um choque em f1, 600 s. Provado no Z3: itens 1, 3,</text><text x="40" y="886" font-size="14" text-anchor="start" fill="#555">33, 34.</text>
</svg>