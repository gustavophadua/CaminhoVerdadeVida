<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
<defs><pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="1.2"/></pattern>
<pattern id="pont" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1" fill="#111"/></pattern></defs>
<rect width="1200" height="900" fill="#fff"/>
<text x="40" y="56" font-size="30" text-anchor="start" fill="#111" font-weight="bold">Esfria e esquenta</text>
<text x="40" y="88" font-size="18" text-anchor="start" fill="#333">O repouso tratado pela ausência: quanto mais quente, mais choques. Na máquina, a fatia esquenta até fechar.</text>
<line x1="200" y1="520" x2="200" y2="190" stroke="#111" stroke-width="3"/><polyline points="204.7,201.1 200,190 195.3,201.1" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="200" y1="560" x2="200" y2="800" stroke="#111" stroke-width="3" stroke-dasharray="10 6"/><polyline points="195.3,788.9 200,800 204.7,788.9" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="10 6" stroke-linejoin="round"/><text x="230" y="220" font-size="20" text-anchor="start" fill="#111" font-weight="bold">ausência sobe</text><text x="230" y="248" font-size="18" text-anchor="start" fill="#111">esfria  ·  positivo (+)</text><text x="230" y="274" font-size="16" text-anchor="start" fill="#333">menos choques</text><text x="230" y="760" font-size="20" text-anchor="start" fill="#111" font-weight="bold">presença desce</text><text x="230" y="788" font-size="18" text-anchor="start" fill="#111">esquenta  ·  negativo (−)</text><text x="230" y="734" font-size="16" text-anchor="start" fill="#333">mais choques e colisões</text><circle cx="200" cy="540" r="10" fill="#111" stroke="#111" stroke-width="0"/><text x="230" y="546" font-size="17" text-anchor="start" fill="#111">repouso: ficar ou sair</text><line x1="620" y1="780" x2="1136" y2="780" stroke="#111" stroke-width="1.2"/><rect x="628" y="636" width="40" height="144" fill="#111"/><text x="648" y="628" font-size="13" text-anchor="middle" fill="#111">24</text><text x="648" y="800" font-size="12" text-anchor="middle" fill="#555">10</text><rect x="674" y="600" width="40" height="180" fill="#111"/><text x="694" y="592" font-size="13" text-anchor="middle" fill="#111">30</text><text x="694" y="800" font-size="12" text-anchor="middle" fill="#555">20</text><rect x="720" y="600" width="40" height="180" fill="#111"/><text x="740" y="592" font-size="13" text-anchor="middle" fill="#111">30</text><text x="740" y="800" font-size="12" text-anchor="middle" fill="#555">30</text><rect x="766" y="582" width="40" height="198" fill="#111"/><text x="786" y="574" font-size="13" text-anchor="middle" fill="#111">33</text><text x="786" y="800" font-size="12" text-anchor="middle" fill="#555">40</text><rect x="812" y="582" width="40" height="198" fill="#111"/><text x="832" y="574" font-size="13" text-anchor="middle" fill="#111">33</text><text x="832" y="800" font-size="12" text-anchor="middle" fill="#555">50</text><rect x="858" y="582" width="40" height="198" fill="#111"/><text x="878" y="574" font-size="13" text-anchor="middle" fill="#111">33</text><text x="878" y="800" font-size="12" text-anchor="middle" fill="#555">60</text><rect x="904" y="546" width="40" height="234" fill="#111"/><text x="924" y="538" font-size="13" text-anchor="middle" fill="#111">39</text><text x="924" y="800" font-size="12" text-anchor="middle" fill="#555">70</text><rect x="950" y="528" width="40" height="252" fill="#111"/><text x="970" y="520" font-size="13" text-anchor="middle" fill="#111">42</text><text x="970" y="800" font-size="12" text-anchor="middle" fill="#555">80</text><rect x="996" y="492" width="40" height="288" fill="#111"/><text x="1016" y="484" font-size="13" text-anchor="middle" fill="#111">48</text><text x="1016" y="800" font-size="12" text-anchor="middle" fill="#555">90</text><rect x="1042" y="420" width="40" height="360" fill="#111"/><text x="1062" y="412" font-size="13" text-anchor="middle" fill="#111">60</text><text x="1062" y="800" font-size="12" text-anchor="middle" fill="#555">100</text><rect x="1088" y="294" width="40" height="486" fill="#111"/><text x="1108" y="286" font-size="13" text-anchor="middle" fill="#111">81</text><text x="1108" y="800" font-size="12" text-anchor="middle" fill="#555">110</text><text x="620" y="180" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Na máquina (todos com força):</text><text x="620" y="206" font-size="16" text-anchor="start" fill="#111">colisões a cada 10 s enquanto o Tubo fecha</text><text x="628" y="824" font-size="14" text-anchor="start" fill="#333">tempo (s)</text>
<line x1="40" y1="844" x2="1160" y2="844" stroke="#d6d6d6" stroke-width="1"/>
<text x="40" y="866" font-size="14" text-anchor="start" fill="#555">Do autor: página 3, itens 8 a 10. Física: "mais quente, mais colisões" é teoria cinética (Boltzmann); D10 em aberto. Medido na máquina, todos com</text><text x="40" y="886" font-size="14" text-anchor="start" fill="#555">força.</text>
</svg>