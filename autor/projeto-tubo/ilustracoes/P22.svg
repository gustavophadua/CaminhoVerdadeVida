<text x="40" y="56" font-size="30" text-anchor="start" fill="#111" font-weight="bold">A aniquilação vira luz</text>
<text x="40" y="88" font-size="18" text-anchor="start" fill="#333">O que se anula é o sinal, não a energia: ela sai inteira como luz.</text>
