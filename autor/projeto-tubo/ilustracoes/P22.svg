<text x="40" y="866" font-size="14" text-anchor="start" fill="#555">Física estabelecida (elétron + pósitron → dois fótons; é o exame PET). Do autor: A.5 ("vira luz"). D18 em aberto: a luz fica no Tubo ou vai para o</text><text x="40" y="886" font-size="14" text-anchor="start" fill="#555">Todo?</text>
